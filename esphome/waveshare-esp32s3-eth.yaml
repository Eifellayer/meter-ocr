# Zählerkamera für das Waveshare ESP32-S3-ETH (mit Kamera, Netzwerkkabel statt WLAN)
# ESP32-S3, 8 MB PSRAM (octal), LAN über W5500, auf Wunsch mit PoE-Modul. Praktisch,
# wenn am Zähler kein WLAN ankommt. Ohne eigenen Blitz: in der App bei Bedarf ein
# externes Licht aus Home Assistant eintragen.
# Noch nicht mit echter Hardware getestet – Rückmeldung erwünscht.

substitutions:
  board_name: Waveshare ESP32-S3-ETH

packages:
  kamera: !include common/kamera.yaml

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

esp32_camera:
  external_clock:
    pin: GPIO3
  i2c_pins:
    sda: GPIO48
    scl: GPIO47
  data_pins: [GPIO41, GPIO45, GPIO46, GPIO42, GPIO40, GPIO38, GPIO15, GPIO18]
  vsync_pin: GPIO1
  href_pin: GPIO2
  pixel_clock_pin: GPIO39
  power_down_pin: GPIO8

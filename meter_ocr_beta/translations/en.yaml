# English names and descriptions in Home Assistant's app configuration tab
configuration:
  esp_url:
    name: SLFork ESP address
    description: Base URL of the ESP running AI on the Edge / SLFork.
  ausschnitt:
    name: Fallback image crop
    description: Pixel coordinates of the fallback digit area as left,top,right,bottom.
  vorkomma_breite:
    name: Whole-digit region width
    description: Width of the whole cubic-meter digits inside the fallback crop, in pixels.
  helle_ziffern:
    name: Light digits (legacy default)
    description: Default contrast hint for OCR when automatic detection is used.
  zeitzone:
    name: Time zone
    description: Time zone for scheduling checks and displaying dates.
  push_dienst:
    name: Optional mobile notification service
    description: Home Assistant mobile notification service, e.g. notify.mobile_app_phone.
  vergleich_nachkommastellen:
    name: Default comparison decimal places
    description: Zero compares whole cubic meters only; 1 to 3 include decimal places. Web settings override this option.
  ocr_versuche:
    name: Default maximum OCR attempts
    description: Maximum number of independent OCR processing attempts per image, from 1 to 10. Web settings override this option.
  kamera_entitaet:
    name: Camera entity (optional)
    description: Home Assistant camera entity used instead of SLFork, e.g. camera.gas_meter.
  referenz_entitaet:
    name: Reference sensor entity (optional)
    description: Cumulative gas meter reading in cubic meters, e.g. sensor.gas_meter_total.
  intervall_sekunden:
    name: Obsolete check interval
    description: Legacy option; scheduling is automatically managed by the app.

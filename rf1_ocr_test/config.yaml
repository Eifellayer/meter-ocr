name: AI Meter Reader
version: "0.5.37"
slug: rf1_ocr_test
description: "Lokale Zählerablesung per Kamera / Local camera-based meter reading"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
map:
  - type: media
    read_only: false
options:
  zeitzone: Europe/Berlin
# 0.5.18: everything else is set up in the app's own page. The old fields stay in the schema as
# optional entries so existing installations keep their values; Home Assistant hides them by default.
schema:
  zeitzone: str
  esp_url: url?
  kamera_entitaet: str?
  referenz_entitaet: str?
  push_dienst: str?
  ausschnitt: str?
  vorkomma_breite: int(1,9999)?
  helle_ziffern: bool?
  vergleich_nachkommastellen: int(0,3)?
  ocr_versuche: int(1,10)?
  intervall_sekunden: int?

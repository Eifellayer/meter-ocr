# English names and descriptions in Home Assistant's app configuration tab (0.5.18)
configuration:
  zeitzone:
    name: Time zone
    description: >-
      Time zone for the check schedule, consumption statistics and times, e.g. Europe/Berlin.
      Everything else – camera, counter, checks, notifications – is set up in the app itself
      (sidebar "AI Meter Reader" or "Open web UI").
  esp_url:
    name: "Legacy: ESP address"
    description: Only for installations before version 0.5. The image source is chosen in the app's setup. Leave empty.
  kamera_entitaet:
    name: "Legacy: camera entity"
    description: Only for installations before version 0.5. The camera is chosen in the app. Leave empty.
  referenz_entitaet:
    name: "Legacy: comparison sensor"
    description: Only for installations before version 0.5. A comparison value is set in the app. Leave empty.
  push_dienst:
    name: "Legacy: push service"
    description: Only for installations before version 0.5. Notifications are set in the app. Leave empty.
  ausschnitt:
    name: "Legacy: image crop"
    description: Only for installations before version 0.5. The app finds the digit area itself. Leave empty.
  vorkomma_breite:
    name: "Legacy: width of the whole cubic metres"
    description: Only for installations before version 0.5. Leave empty.
  helle_ziffern:
    name: "Legacy: light digits"
    description: Only for installations before version 0.5. The app detects the digit colour itself. Leave empty.
  vergleich_nachkommastellen:
    name: "Legacy: decimals"
    description: Only for installations before version 0.5. The precision is set in the app. Leave empty.
  ocr_versuche:
    name: "Legacy: reading attempts"
    description: Only for installations before version 0.5. Leave empty.
  intervall_sekunden:
    name: "Legacy: check interval"
    description: No longer used; the app schedules its checks itself. Leave empty.
